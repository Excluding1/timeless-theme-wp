<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Timeless Pipeline — demo</title>
<style>
  /* Rebuilt 2026-08-05 to the locked panel spec (docs/specs/pipeline-app-plan §10):
     one screen (queue ⇄ detail), one question with at most three visible rows,
     Call/Text chips that really dial, and nothing that doesn't change a decision. */
  :root{
    --navy:#0b1526; --ink:#18181b; --ink2:#3f3f46; --muted:#71717a; --line:#e4e4e7;
    --bg:#fafafa; --card:#fff; --gold:#e7c08b;
    --blue:#2563eb; --bluebg:#eff4ff;
    --green:#16a34a; --greenbg:#ecfdf3;
    --orange:#ea8a0c; --orangebg:#fff7ed;
    --purple:#7c3aed; --purplebg:#f5f3ff;
    --grey:#9ca3af; --greybg:#f3f4f6;
    --red:#dc2626; --redbg:#fef2f2;
    --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:0 14px 60px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
  .blogo{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;
         place-items:center;font-weight:800;font-size:12px;flex:none}
  .bname{font-weight:800;font-size:15px}
  .stats{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
  .stats b{color:var(--ink)}
  .stats .bad{color:var(--red);font-weight:700}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
  .search{flex:1;min-width:160px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:9px;
                font:inherit;font-size:13.5px;background:var(--card);min-height:44px}
  .search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .tbtn{border:1px solid var(--line);background:var(--card);font:inherit;font-size:13px;
        padding:8px 13px;min-height:44px;border-radius:9px;cursor:pointer;color:var(--ink2)}
  .tbtn.on{border-color:var(--blue);color:var(--blue);font-weight:700;background:var(--bluebg)}

  /* ---------- queue rows: one line each, the ranked list IS the home screen ---------- */
  .row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
       border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:60px}
  .row:hover{border-color:#d7dde7;box-shadow:0 2px 8px rgba(16,24,40,.05)}
  .row.stale{border-color:#f3c7c7}
  .ravwrap{position:relative;flex:none}
  .rav{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:800;
       font-size:12.5px;flex:none}
  /* where the lead came from: quote form, missed call, text, referral… */
  .rsrc{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;
        background:#fff;border:1px solid var(--line);display:grid;place-items:center;
        color:var(--ink2);box-shadow:0 1px 2px rgba(16,24,40,.08)}
  .rsrc.missed{color:var(--red);border-color:#f3c7c7}
  .rmain{min-width:0;flex:1}
  .rname{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rname .sub{font-weight:400;color:var(--muted)}
  .rwhy{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rwhy.hot{color:var(--red)}
  .rside{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .rage{font-size:11.5px;color:var(--muted)}
  .rage.stale{color:var(--red);font-weight:700}
  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .pill.active{background:var(--greenbg);color:var(--green)}
  .pill.new{background:var(--bluebg);color:var(--blue)}
  .pill.triage{background:var(--orangebg);color:var(--orange)}
  .pill.won{background:var(--greenbg);color:var(--green)}
  .pill.lost{background:var(--greybg);color:var(--muted)}
  .pill.rep{background:var(--purplebg);color:var(--purple);display:inline-flex;align-items:center;gap:4px}
  /* mini phase bar on rows: five icon dots, never words */
  .rtrack{display:none;align-items:center;flex:none;margin-left:4px}
  .rdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;
        border:1.5px solid var(--line);background:#fff;color:#c4c8d0}
  .rdot.done{border-color:currentColor;background:currentColor}
  .rdot.done svg{color:#fff;stroke:#fff}
  .rdot.now{border-color:currentColor;border-width:2px;position:relative}
  /* the live phase breathes, same as on the detail tracker */
  .rdot.now::before{content:'';position:absolute;inset:-5px;border-radius:50%;
       background:currentColor;opacity:.18;animation:tpulse 2s ease-out infinite}
  @media (prefers-reduced-motion:reduce){ .rdot.now::before{animation:none;opacity:.15} }
  .rline{width:10px;height:2px;background:var(--line);flex:none}
  @media (min-width:560px){ .rtrack{display:flex} }
  /* under 560px the row is name + why + pill; the dots return on the detail screen */
  @media (max-width:559px){
    .row{flex-wrap:wrap}
    .rtrack{display:flex;width:100%;order:5;margin:4px 0 0 47px}
  }
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .resetb{border:1px solid var(--line);background:var(--card);font:inherit;font-size:12.5px;
          padding:8px 14px;min-height:44px;border-radius:8px;cursor:pointer;color:var(--muted);margin-top:18px}

  /* ---------- detail ---------- */
  .backb{border:0;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--blue);
         cursor:pointer;padding:10px 0;min-height:44px;display:flex;align-items:center}
  h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13.5px;margin:3px 0 0}
  .pin{display:flex;align-items:flex-start;gap:8px;background:var(--orangebg);
       border:1px solid #f5d9ac;border-radius:9px;padding:9px 12px;margin:10px 0 0;
       font-size:13px;color:#7c4a03}
  .pin svg{flex:none;margin-top:1px}

  .grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
  @media (min-width:860px){ .grid2{grid-template-columns:minmax(0,1fr) 300px} }

  /* Call / Text — the tap IS the record: it dials or opens Messages with the
     draft prefilled, and the same tap logs who/when/channel */
  .chips{display:flex;gap:8px;margin:0 0 10px}
  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
        border:1px solid var(--line);background:var(--card);border-radius:10px;
        padding:11px;min-height:48px;font:inherit;font-size:14px;font-weight:700;
        color:var(--ink);text-decoration:none;cursor:pointer}
  .chip:active{background:var(--bluebg)}

  /* the question card */
  .qcard{background:var(--navy);border-radius:14px;padding:18px;color:#fff}
  .qstage{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
          margin-bottom:6px}
  .qtext{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
  .qwhy{font-size:12.5px;color:#b9c2d4;margin:0 0 12px}
  .qtry{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#b9c2d4;margin:0 0 12px}
  .qtry.over{color:#fca5a5}
  .qhint{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--gold);
         background:rgba(231,192,139,.10);border:1px solid rgba(231,192,139,.28);
         border-radius:9px;padding:9px 11px;margin:0 0 12px;line-height:1.45}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:center;gap:10px;border:0;border-radius:10px;padding:13px 14px;
       min-height:50px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-align:left;
       background:rgba(255,255,255,.08);color:#e6e9f0}
  .opt svg{flex:none}
  .opt.good{background:#fff;color:var(--ink);font-weight:700}
  .opt em{font-style:normal;font-weight:600;font-size:11.5px;opacity:.62;margin-left:auto}
  .opt.capped{opacity:.45}
  .opt.fold{color:#96a0b5;background:rgba(255,255,255,.05)}
  .opt.giveup{background:rgba(220,38,38,.14);border:1px solid rgba(220,38,38,.42);color:#fecaca}
  .badopts{display:none;flex-direction:column;gap:8px}
  .badopts.on{display:flex}

  /* desktop fallback for the prefilled text */
  .draftfold{margin-top:10px}
  .draftfold summary{font-size:12px;color:#96a0b5;cursor:pointer;padding:6px 0;min-height:44px;
                     display:flex;align-items:center}
  .draft textarea{width:100%;border:0;border-radius:9px;padding:10px;font:inherit;font-size:13px;
                  resize:vertical;background:#fff;color:var(--ink)}
  .dcopy{border:0;background:var(--gold);color:#3d2c10;font:inherit;font-size:13px;font-weight:700;
         padding:10px 14px;min-height:44px;border-radius:9px;cursor:pointer;margin-top:8px}

  /* end states */
  .endcard{border-radius:14px;padding:30px 18px;text-align:center}
  .endcard.won{background:var(--greenbg);color:var(--green)}
  .endcard.closed{background:var(--greybg);color:var(--ink2)}
  .endcard .big{font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;
                gap:8px;margin-bottom:4px}
  .revnote{font-size:12.5px;color:var(--muted);margin-top:6px}

  /* progress (detail only) — the 5 milestones */
  .prog{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .track{margin:2px 4px 0;position:relative}
  .tlabels{display:flex;justify-content:space-between;gap:6px;margin-bottom:9px}
  .tlabels span{font-size:11.5px;color:var(--muted);flex:1;min-width:0;text-align:center;
                display:inline-flex;align-items:center;justify-content:center;gap:4px}
  .tlabels span b{font-weight:inherit}
  .tlabels span.on b{font-weight:700}
  @media (max-width:480px){ .tlabels span b{display:none} .tlabels span svg{width:15px;height:15px} }
  .tlabels span:first-child{justify-content:flex-start}
  .tlabels span:last-child{justify-content:flex-end}
  .tlabels span.on{color:var(--ink);font-weight:700}
  .tline{position:relative;height:14px}
  .tbase{position:absolute;top:6px;left:7px;right:7px;height:2px;background:#e4e4e7;border-radius:2px}
  .tfill{position:absolute;top:6px;left:7px;height:2px;border-radius:2px;opacity:.9}
  .tdots{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center}
  .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line);flex:none}
  .dot.done{border-color:currentColor;background:currentColor}
  .dot.now{border-color:currentColor;border-width:3.5px;position:relative;background:#fff}
  .dot.now::before{content:'';position:absolute;inset:-6px;border-radius:50%;
       background:currentColor;opacity:.18;animation:tpulse 2s ease-out infinite}
  @keyframes tpulse{
    0%{transform:scale(.75);opacity:.30} 70%{transform:scale(1.5);opacity:0} 100%{transform:scale(1.5);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){ .dot.now::before{animation:none;opacity:.18} }
  .tstate{font-size:12.5px;margin-top:10px;color:var(--ink2)}
  .tstate b{font-weight:700}

  /* right column boxes */
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
       margin-bottom:12px}
  .box h3{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
          color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;
      border-bottom:1px solid #f4f4f5}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted);flex:none}
  .kv .v{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
  .kv .v.warn{color:var(--red)}
  .cstat{display:flex;gap:8px;margin-bottom:10px}
  .cstat div{flex:1;background:var(--bg);border-radius:9px;padding:8px 6px;text-align:center}
  .cstat b{display:block;font-size:15px}
  .cstat span{font-size:11px;color:var(--muted)}
  .ojob{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #f4f4f5;
        cursor:pointer;min-height:44px}
  .ojob .ow{font-size:13px;font-weight:600}
  .ojob .om{font-size:11.5px;color:var(--muted)}
  .opill{margin-left:auto;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}
  .opill.won{background:var(--greenbg);color:var(--green)}
  .opill.lost{background:var(--greybg);color:var(--muted)}
  .opill.open{background:var(--bluebg);color:var(--blue)}
  .addnote{display:flex;gap:6px;margin-bottom:10px}
  .addnote input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;
                 font-size:13px;min-width:0;min-height:44px}
  .addnote button{border:1px solid var(--line);background:var(--card);border-radius:8px;font:inherit;
                  font-size:12.5px;font-weight:700;padding:0 12px;min-height:44px;cursor:pointer}
  .pinbtn.on{background:var(--orangebg);border-color:#f5d9ac;color:#b45309}
  .note{font-size:13px;padding:7px 0;border-top:1px solid #f4f4f5}
  .note:first-of-type{border-top:0}
  .nmeta{font-size:11.5px;color:var(--muted);margin-top:2px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(9,14,24,.5);display:none;align-items:flex-end;
         justify-content:center;z-index:60}
  .modal.on{display:flex}
  .msheet{background:#fff;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
          width:100%;max-width:520px}
  @media (min-width:640px){ .modal{align-items:center} .msheet{border-radius:16px} }
  .msheet h3{margin:0 0 4px;font-size:17px}
  .msheet p{margin:0 0 12px;font-size:13px;color:var(--muted)}
  .msheet label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
  .msheet input,.msheet select{width:100%;border:1px solid var(--line);border-radius:9px;
      padding:12px;font:inherit;font-size:16px;min-height:48px}
  .whorow{display:flex;gap:8px}
  .whorow button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;font:inherit;
                 font-size:13.5px;font-weight:700;padding:11px;min-height:48px;cursor:pointer;color:var(--muted)}
  .whorow button.on{border-color:var(--blue);color:var(--blue);background:var(--bluebg)}
  .warnbox{display:flex;align-items:center;gap:7px;background:var(--redbg);color:var(--red);
           border-radius:8px;padding:9px 11px;font-size:12.5px;font-weight:600;margin-top:10px}
  .mbtn{width:100%;border:0;background:var(--blue);color:#fff;font:inherit;font-size:15px;
        font-weight:700;padding:14px;min-height:50px;border-radius:10px;cursor:pointer;margin-top:12px}
  .mbtn.mcancel{background:none;color:var(--muted);font-weight:600;min-height:44px;padding:8px;margin-top:4px}

  /* toast — confirms the chain moved on */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);
         color:#fff;font-size:13.5px;font-weight:600;padding:8px 10px 8px 18px;border-radius:999px;
         box-shadow:0 6px 20px rgba(9,14,24,.3);z-index:70;display:flex;align-items:center;gap:10px;
         opacity:0;transition:opacity .18s;pointer-events:none;max-width:92vw}
  .toast.on{opacity:1;pointer-events:auto}
  .toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast button{border:0;background:var(--gold);color:#3d2c10;font:inherit;font-size:13px;
                font-weight:800;padding:8px 16px;min-height:44px;border-radius:999px;cursor:pointer;flex:none}
</style>

<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="msheet" id="msheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<!-- ?test=1 runs the model, behaviour, simulation and usability suite over the live app -->
<script>if(location.search.indexOf('test')>-1){var t=document.createElement('script');t.src='test/suite.js';document.body.appendChild(t);}</script>
