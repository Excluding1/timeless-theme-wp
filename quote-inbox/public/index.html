<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timeless · Quote Inbox</title>
<style>
  :root{
    --navy:#041534; --navy2:#0a2d52; --gold:#e7c08b; --gold-ink:#6b4e12;
    --ink:#151c27; --muted:#5a6472; --faint:#6b7688;
    --line:#e2e6ee; --bg:#eef1f6; --card:#fff; --panel:#f6f8fb;
    --good:#1c7a49; --good-bg:#e6f2ec; --warn:#a4530a; --warn-bg:#fdf0e2;
    --danger:#b81f1f; --danger-bg:#fdeaea; --radius:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --navy:#0b1c3a; --gold:#e7c08b; --gold-ink:#e7c08b;
      --ink:#e8ecf3; --muted:#9aa6b8; --faint:#8794a8;
      --line:#26303f; --bg:#0c111a; --card:#141b26; --panel:#1b2430;
      --good:#5fcf97; --good-bg:#14301f; --warn:#f0b46a; --warn-bg:#33230f;
      --danger:#f28a8a; --danger-bg:#3a1717;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit}
  header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.22)}
  .htop{display:flex;align-items:center;gap:14px;padding:12px 18px}
  header h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;white-space:nowrap}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
  .search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
  .search input{flex:1;min-width:0;border:0;background:0;color:#fff;font-size:14px;outline:none}
  .search input::placeholder{color:#9fb0cc}
  .refresh{border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;flex:none}
  .refresh:hover{background:rgba(255,255,255,.24)}
  .viewtoggle{display:flex;gap:2px;background:rgba(255,255,255,.10);border-radius:10px;padding:3px;flex:none}
  .viewtoggle button{border:0;background:0;color:#cdd8ea;font-weight:700;font-size:13px;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .viewtoggle button.on{background:var(--gold);color:#3a2c08}
  @media(max-width:640px){.viewtoggle button{padding:6px 9px;font-size:0}.viewtoggle button::first-letter{font-size:15px}}
  /* list view */
  .qlist{display:flex;flex-direction:column;gap:9px}
  .qrow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;transition:box-shadow .12s,border-color .12s}
  .qrow:hover{box-shadow:0 4px 16px rgba(12,22,44,.10);border-color:#cfd6e2}
  .qrow .thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--panel);flex:none;border:1px solid var(--line)}
  .qrow .thumb.none{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:18px}
  .qrow .main{flex:1;min-width:0}
  .qrow .nm{font-weight:800;color:var(--ink);font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qrow .ad{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qrow .rmeta{display:flex;gap:6px;align-items:center;flex:none}
  .qrow .when{color:var(--faint);font-size:12px;font-weight:600;white-space:nowrap}
  .qrow .flag{color:var(--danger);font-size:13px}
  .tabs{display:flex;gap:6px;padding:0 14px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{border:0;background:rgba(255,255,255,.10);color:#cdd8ea;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:none}
  .tab.active{background:var(--gold);color:#3a2c08}
  .tab .n{opacity:.75;font-weight:800;margin-left:5px}

  .wrap{max-width:780px;margin:0 auto;padding:20px 16px 40px}
  .status{color:var(--muted);text-align:center;padding:54px 20px;font-size:15px}
  .status b{color:var(--ink)}
  .status .retry{margin-top:16px;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:800;cursor:pointer}
  .skel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);height:340px;position:relative;overflow:hidden}
  .skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(125,140,170,.10),transparent);animation:sh 1.3s infinite}
  @keyframes sh{100%{transform:translateX(100%)}}

  .counter{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 2px 14px;color:var(--muted);font-size:13px;font-weight:700}
  .counter .pos{color:var(--ink)}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:0 12px 36px rgba(12,22,44,.12);overflow:hidden;border:1px solid var(--line)}
  .chead{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
  .crow{display:flex;align-items:flex-start;gap:12px}
  .who{flex:1;min-width:0}
  .who h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em;color:var(--ink);font-weight:800;overflow-wrap:anywhere}
  .addr{color:var(--muted);font-size:14.5px;display:inline-flex;align-items:center;gap:6px;overflow-wrap:anywhere;text-decoration:none;border-bottom:1px dashed transparent}
  .addr:hover{border-bottom-color:var(--muted)}
  .when{font-size:12.5px;color:var(--faint);white-space:nowrap;font-weight:700}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .badge{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .badge.gold{background:rgba(231,192,139,.22);color:var(--gold-ink);border-color:transparent}
  .badge.new{background:var(--good-bg);color:var(--good);border-color:transparent}
  .badge.rev{background:var(--panel);color:var(--faint)}
  .badge.tier{background:var(--navy);color:#fff;border-color:transparent}

  .cbody{padding:18px 22px 6px}
  .section{margin-bottom:18px}
  .label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .label .copy{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--navy);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:pointer}
  @media(prefers-color-scheme:dark){.label .copy{color:var(--gold)}}
  .req{font-size:16.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .req.empty{color:var(--faint);font-style:italic;font-size:15px}

  /* quote scope panel */
  .scope{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .li{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .li .area{font-weight:800;color:var(--ink);min-width:118px;flex:none}
  .li .svc{color:var(--muted);font-size:14.5px}
  .li .svc .d{display:block;color:var(--faint);font-size:13px;margin-top:2px}
  .mods{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .mod{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(231,192,139,.2);color:var(--gold-ink)}
  .mod.minus{background:var(--good-bg);color:var(--good)}
  .mod .delta{font-weight:800;margin-left:6px}

  /* risk / missing-info checklist */
  .flags{display:flex;flex-direction:column;gap:8px}
  .flag{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;padding:10px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
  .flag.high{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
  .flag .ic{flex:none;font-weight:900}
  .lost{background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);border-radius:13px;padding:13px 15px;font-size:14.5px;font-weight:700}

  .facts{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}
  @media(max-width:520px){.facts{grid-template-columns:1fr}}
  .fact{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;border-bottom:1px dashed var(--line);padding-bottom:7px}
  .fact .k{color:var(--muted)}
  .fact .v{font-weight:700;color:var(--ink);text-align:right}

  .areagroup{margin-bottom:14px}
  .areagroup .ah{font-size:12.5px;font-weight:800;color:var(--muted);margin:0 0 7px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
  .shot{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:var(--panel);cursor:zoom-in;border:1px solid var(--line);padding:0}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .tag{position:absolute;left:7px;bottom:7px;background:rgba(4,21,52,.82);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
  .shot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .nophoto{color:var(--faint);font-style:italic;font-size:14.5px}

  .footer-actions{display:flex;gap:10px;padding:16px 22px 20px;border-top:1px solid var(--line);background:var(--card)}
  .btn{flex:1;border:0;border-radius:14px;padding:15px 12px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .05s,filter .15s;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn.call{background:var(--good);color:#fff}
  .btn.ghl{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
  .btn.done{background:var(--navy);color:#fff}
  .btn.done.is{background:var(--good-bg);color:var(--good)}
  .btn.pdf{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);flex:none;padding-left:16px;padding-right:16px}

  .nav{display:flex;gap:10px;margin-top:14px}
  .nav button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px;font-weight:800;color:var(--ink);cursor:pointer;font-size:14px}
  .nav button:disabled{opacity:.4;cursor:default}
  .hint{text-align:center;color:var(--faint);font-size:12px;margin-top:12px}
  kbd{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font:inherit;font-size:11px;font-weight:700;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* mobile: sticky thumb-reach action bar */
  @media(max-width:640px){
    .footer-actions{position:sticky;bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.12);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    .wrap{padding-bottom:20px}
    .btn.call .full{display:none}
  }

  .lb{position:fixed;inset:0;background:rgba(6,12,26,.95);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
  .lb.open{display:flex}
  .lb img{max-width:96vw;max-height:80vh;border-radius:10px;object-fit:contain}
  .lb .x{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;cursor:pointer;background:0;border:0;line-height:1}
  .lb .lbnav{display:flex;gap:16px;align-items:center;color:#cdd6e6;font-size:14px;font-weight:700}
  .lb .lbnav button,.lb .lbnav a{cursor:pointer;background:rgba(255,255,255,.14);padding:9px 16px;border-radius:10px;font-weight:800;color:#fff;border:0;text-decoration:none}
  .lb .lbnav a.dl{background:var(--gold);color:#3a2c08}

  /* print / save-as-PDF: isolate the current request card into a clean one-pager */
  @media print{
    @page{ margin:14mm; }
    header,#nav,#hint,#counter,#lb,#toast,.footer-actions,.copy{ display:none !important; }
    body{ background:#fff !important; }
    body::before{ content:"Timeless Resurfacing — Quote Request"; display:block; font:700 12px system-ui,sans-serif; color:#041534; margin:0 0 10px }
    .wrap{ max-width:none; margin:0; padding:0 }
    #stage{ height:auto !important }
    .card{ box-shadow:none !important; border:0 !important; border-radius:0 !important; margin:0 !important }
    .cbody{ overflow:visible !important; max-height:none !important }
    .card,.section,.areagroup,.gallery,.shot,.flag,.li,.fact{ break-inside:avoid }
    .gallery img{ max-height:58mm; width:auto }
    a{ color:inherit !important; text-decoration:none !important }
  }
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1><span class="dot"></span> Quote Inbox</h1>
    <label class="search">🔍<input id="q" type="search" placeholder="Search name or address…" autocomplete="off" /></label>
    <div class="viewtoggle" id="viewtoggle">
      <button data-mode="card" class="on" title="Card view (one at a time)">▤ Cards</button>
      <button data-mode="list" title="List view (all at once)">☰ List</button>
    </div>
    <button class="refresh" id="refresh" title="Refresh">↻</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="wrap">
  <div class="counter" id="counter" style="display:none">
    <span class="pos" id="pos"></span><span id="sub"></span>
  </div>
  <div id="stage"><div class="skel"></div></div>
  <div class="nav" id="nav" style="display:none">
    <button id="prev">← Previous</button>
    <button id="next">Next →</button>
  </div>
  <div class="hint" id="hint" style="display:none">
    <kbd>←</kbd> <kbd>→</kbd> move · <kbd>C</kbd> call · <kbd>R</kbd> reviewed · <kbd>G</kbd> GHL · <kbd>/</kbd> search
  </div>
</div>

<div class="lb" id="lb">
  <button class="x" id="lbx" aria-label="Close">×</button>
  <img id="lbimg" alt="Quote photo enlarged" />
  <div class="lbnav">
    <button id="lbprev" aria-label="Previous photo">‹ Prev</button>
    <span id="lbcount"></span>
    <button id="lbnext" aria-label="Next photo">Next ›</button>
    <a class="dl" id="lbdl" target="_blank" rel="noopener">Download original</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
